<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distance Calculation with Geoapify</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-control {
      border-color: rgba(0, 0, 0, 0.468);
      border-width: 2px;
    }
  </style>
</head>

<body>
  <div id="map" style="width: 100%; height: 500px;"></div>

  <!-- Search -->
  <div class="input-group my-3 mx-2">
    <input type="search" list="suggestions" class="form-control rounded-2" id="search"
      placeholder="Search location..." />
    <datalist id="suggestions"></datalist>
    <button class="btn btn-primary mx-4 rounded-5" onclick="clearmap()">Clear map🧹</button>
  </div>

  <p>Where you are: <span id="marker1-address"></span> (<span id="marker1-coordinates">Not selected</span>)</p>
  <p>Where you go: <span id="marker2-address"></span> (<span id="marker2-coordinates">Not selected</span>)</p>
  <p>Distance: <span id="distance">N/A</span></p>
  <button type="button" class="btn btn-primary mb-4" onclick="calculateRoute()">Find route</button>

  <script>
    const map = L.map('map').setView([20.5937, 78.9629], 5); // Centered in India
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let marker1, marker2; // For storing the two markers
    let coords1, coords2; // For storing the coordinates of the two markers
    let routeLine = null;
    const apiKey = "b8568cb9afc64fad861a69edbddb2658"; // Replace with your actual API key

    // Initialize map click handler
    map.on('click', async function (e) {
      const { lat, lng } = e.latlng;

      // Handle Marker 1
      if (!marker1) {
        marker1 = L.marker([lat, lng]).addTo(map).bindPopup("Starting point").openPopup();
        coords1 = { lat, lng };
        document.getElementById("marker1-coordinates").textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        await updateAddress(lat, lng, "marker1-address");
      }
      // Handle Marker 2
      else if (!marker2) {
        marker2 = L.marker([lat, lng]).addTo(map).bindPopup("Destination").openPopup();
        coords2 = { lat, lng };
        document.getElementById("marker2-coordinates").textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        await updateAddress(lat, lng, "marker2-address");
        calculateDistance(coords1, coords2);
      }
      // Both markers are set
      else {
        alert("Markers already set! Clear the map to reset.");
      }
    });

    // Function to fetch and update address for a given coordinate
    async function updateAddress(lat, lng, addressElementId) {
      try {
        const response = await fetch(
          `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lng}&apiKey=${apiKey}`
        );
        const data = await response.json();
        console.log(data);

        const address = data.features[0]?.properties.formatted || "Unknown location";
        document.getElementById(addressElementId).textContent = address;
      } catch (error) {
        console.error("Error fetching address:", error);
        document.getElementById(addressElementId).textContent = "Error fetching address.";
      }
    }

    // Function to calculate distance between two coordinates
    async function calculateDistance(coord1, coord2) {
      const body = {
        mode: "drive",
        sources: [{ location: [coord1.lng, coord1.lat] }],
        targets: [{ location: [coord2.lng, coord2.lat] }]
      };

      try {
        const response = await fetch(
          `https://api.geoapify.com/v1/routematrix?apiKey=${apiKey}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          }
        );

        const data = await response.json();
        const distance = data.sources_to_targets[0][0].distance; // Distance in meters
        const distanceInKm = (distance / 1000).toFixed(2); // Convert to kilometers
        document.getElementById("distance").innerText = `${distanceInKm} km`;
      } catch (error) {
        console.error("Error calculating distance:", error);
        document.getElementById("distance").textContent = "Error calculating distance.";
      }
    }

    // Function to calculate and display route
async function calculateRoute() {
  if (!marker1 || !marker2) {
    alert("Please set both markers first!");
    return;
  }

  try {
    const response = await fetch(
      `https://api.geoapify.com/v1/routing?waypoints=${coords1.lat},${coords1.lng}|${coords2.lat},${coords2.lng}&mode=drive&apiKey=${apiKey}`
    );
    const data = await response.json();
    console.log("Routing API response:", data);

    // Remove previous route if exists
    if (routeLine) {
      map.removeLayer(routeLine);
    }

    if (data.features && data.features.length > 0) {
      // Geoapify returns MultiLineString with array of line strings
      const multiLineString = data.features[0].geometry.coordinates;

      // Create an array of all route points
      const allPoints = [];
      multiLineString.forEach(lineString => {
        lineString.forEach(coord => {
          // Convert from [longitude, latitude] to Leaflet's [latitude, longitude]
          allPoints.push(L.latLng(coord[1], coord[0]));
        });
      });

      // Create the route line with proper styling
      routeLine = L.polyline(allPoints, {
        color: '#3388ff',
        weight: 5,
        opacity: 0.7,
        lineJoin: 'round'
      }).addTo(map);

      // Fit the map to show both markers and the route
      const group = new L.featureGroup([marker1, marker2, routeLine]);
      map.fitBounds(group.getBounds().pad(0.5));
    } else {
      console.error("No route found in response");
      alert("No route could be calculated between these points.");
    }
  } catch (error) {
    console.error("Error calculating route:", error);
    alert("Error calculating route. Please try again.");
  }
}

    // Search handling
    const inputSearch = document.getElementById("search");
    const datalist = document.getElementById("suggestions");
    let searchTimeout, searchResults;

    inputSearch.addEventListener("input", (e) => {
      clearTimeout(searchTimeout);

      searchTimeout = setTimeout(() => {
        const searchText = e.target.value;
        if (searchText.length < 2) return;

        fetch(`https://api.geoapify.com/v1/geocode/autocomplete?text=${searchText}&lang=en&limit=7&format=json&apiKey=${apiKey}`)
          .then(res => res.json())
          .then(data => {
            searchResults = data.results;
            datalist.innerHTML = "";
            data.results.forEach(r => {
              const opt = document.createElement("option");
              opt.value = r.formatted;
              datalist.appendChild(opt);
            });
          });
      }, 600);
    });

    inputSearch.addEventListener("change", (e) => {
      const val = inputSearch.value;
      const match = searchResults.find(r => r.formatted === val);

      if (match) {
        const lat = match.lat;
        const lng = match.lon;
        map.setView([lat, lng], 13);

        // If no markers exist, set marker1
        if (!marker1) {
          marker1 = L.marker([lat, lng]).addTo(map).bindPopup("Starting point").openPopup();
          coords1 = { lat, lng };
          document.getElementById("marker1-coordinates").textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          updateAddress(lat, lng, "marker1-address");
        }
        // Otherwise set marker2
        else if (!marker2) {
          marker2 = L.marker([lat, lng]).addTo(map).bindPopup("Destination").openPopup();
          coords2 = { lat, lng };
          document.getElementById("marker2-coordinates").textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          updateAddress(lat, lng, "marker2-address");
          calculateDistance(coords1, coords2);
        }
      }
    });

    // Clear map function
    function clearmap() {
      if (marker1) map.removeLayer(marker1);
      if (marker2) map.removeLayer(marker2);
      if (routeLine) map.removeLayer(routeLine);

      marker1 = null;
      marker2 = null;
      coords1 = null;
      coords2 = null;
      routeLine = null;

      document.getElementById("marker1-coordinates").textContent = "Not selected";
      document.getElementById("marker2-coordinates").textContent = "Not selected";
      document.getElementById("marker1-address").textContent = "";
      document.getElementById("marker2-address").textContent = "";
      document.getElementById("distance").textContent = "N/A";
    }
  </script>
</body>

</html>
